name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Review gate hook self-test
        run: node .claude/hooks/role-gate.mjs --self-test
      # GUARD: the application does not exist yet. The two steps below are
      # skipped until `package.json` exists. Ticket #2 (B2-01, walking
      # skeleton) adds it, and they then run by themselves. No ticket edits
      # this file; only the owner may later delete the `if:` lines.
      - name: Install (npm ci)
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci
      - name: Test (npm test)
        if: ${{ hashFiles('package.json') != '' }}
        run: npm test
